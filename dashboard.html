<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard | NextGenLearners</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Dashboard Header -->
    <header class="dashboard-header">

        <div class="dashboard-logo">
            <h2>NextGenLearners</h2>
        </div>

        <button id="logoutBtn" class="logout-btn">
            Logout
        </button>

    </header>


    <!-- Main Dashboard -->
    <main class="dashboard-container">

        <!-- Welcome Section -->
        <section class="welcome-section">

            <div>
                <p class="welcome-label">Applicant Dashboard</p>

                <h1>
                    Welcome back, <span id="userName">User</span>!
                </h1>

                <p>
                    Track your internship applications and application progress.
                </p>
            </div>

        </section>


        <!-- Applications Section -->
        <section class="applications-section">

            <div class="section-heading">
                <div>
                    <p class="section-label">Your Applications</p>
                    <h2>Application Status</h2>
                </div>
            </div>


            <!-- Applications will be generated by JavaScript -->
            <div id="applicationsContainer" class="applications-container">

                <!-- JavaScript will insert application cards here -->

            </div>

        </section>

    </main>


    <script src="dashboard.js"></script>

</body>

</html>
