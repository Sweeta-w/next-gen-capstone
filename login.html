<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | NextGenLearners</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="auth-page">

        <div class="auth-container">

            <!-- Branding -->
            <div class="auth-brand">
                <h1>NextGenLearners</h1>
                <p>Empowering Pakistan's Next Generation of Tech Talent</p>
            </div>


            <!-- Login Form -->
            <section class="auth-card">

                <h2>Welcome Back</h2>
                <p class="auth-subtitle">Login to access your dashboard.</p>

                <form id="loginForm">

                    <div class="form-group">
                        <label for="loginEmail">Email</label>

                        <input
                            type="email"
                            id="loginEmail"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label for="loginPassword">Password</label>

                        <input
                            type="password"
                            id="loginPassword"
                            name="password"
                            placeholder="Enter your password"
                            required
                        >
                    </div>


                    <!-- JavaScript will display errors here -->
                    <p id="loginError" class="error-message"></p>


                    <button type="submit" class="auth-btn">
                        Login
                    </button>

                </form>


                <p class="auth-switch">
                    Don't have an account?
                    <button type="button" id="showSignup">
                        Sign up
                    </button>
                </p>

            </section>


            <!-- Signup Form -->
            <section class="auth-card hidden" id="signupSection">

                <h2>Create Account</h2>
                <p class="auth-subtitle">Create your NextGenLearners account.</p>

                <form id="signupForm">

                    <div class="form-group">
                        <label for="signupName">Full Name</label>

                        <input
                            type="text"
                            id="signupName"
                            name="name"
                            placeholder="Enter your full name"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label for="signupEmail">Email</label>

                        <input
                            type="email"
                            id="signupEmail"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label for="signupPassword">Password</label>

                        <input
                            type="password"
                            id="signupPassword"
                            name="password"
                            placeholder="Create a password"
                            required
                        >
                    </div>


                    <!-- JavaScript will display errors here -->
                    <p id="signupError" class="error-message"></p>


                    <button type="submit" class="auth-btn">
                        Create Account
                    </button>

                </form>


                <p class="auth-switch">
                    Already have an account?
                    <button type="button" id="showLogin">
                        Login
                    </button>
                </p>

            </section>

        </div>

    </main>


    <script src="auth.js"></script>

</body>
</html>
